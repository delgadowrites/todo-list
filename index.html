<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>To-Do Quest</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="icon" href="lildude.png">

</head>

<body>
  <h1>To-Do Quest</h1>
  <button type="button" id="hero-button">Hero</button>

  <!-- Character sheet: a <dialog> opens on top of the page, and Esc closes it -->
  <!-- The text below is a starting point; showHero() in script.js fills in the real numbers -->
  <dialog id="hero-sheet" aria-labelledby="hero-name">
    <!-- Inner box holds the padding, so a click on the dialog itself can only mean the backdrop -->
    <div class="sheet-inner">
      <button type="button" id="hero-close" aria-label="Close character sheet">×</button>

      <div class="sheet-header">
        <img src="lildude.png" alt="Your hero" class="hero-portrait">
        <div>
          <!-- Name row: the name and an edit button (hidden while renaming) -->
          <div id="name-row">
            <h2 id="hero-name">Lil Dude</h2>
            <button type="button" id="rename-button" aria-label="Change hero name">edit</button>
          </div>
          <!-- Rename form: shows in place of the name row while renaming -->
          <form id="rename-form" hidden>
            <label for="rename-input" class="visually-hidden">Hero name</label>
            <input type="text" id="rename-input" maxlength="20" autocomplete="off" required>
            <button type="submit" id="rename-save">Save</button>
          </form>
          <p id="hero-title">Novice</p>
        </div>
      </div>

      <div class="sheet-level">
        <span id="sheet-level">LV 1</span>
        <span class="mini-bar"><span class="mini-fill" id="sheet-fill"></span></span>
        <span id="sheet-numbers">0 / 60 XP</span>
      </div>

      <h3>Stats</h3>
      <ul class="stat-list">
        <li class="stat" data-stat="STR">
          <span class="stat-name">STR</span>
          <span class="mini-bar"><span class="mini-fill"></span></span>
          <span class="stat-level">LV 1</span>
        </li>
        <li class="stat" data-stat="INT">
          <span class="stat-name">INT</span>
          <span class="mini-bar"><span class="mini-fill"></span></span>
          <span class="stat-level">LV 1</span>
        </li>
        <li class="stat" data-stat="CRE">
          <span class="stat-name">CRE</span>
          <span class="mini-bar"><span class="mini-fill"></span></span>
          <span class="stat-level">LV 1</span>
        </li>
        <li class="stat" data-stat="CHA">
          <span class="stat-name">CHA</span>
          <span class="mini-bar"><span class="mini-fill"></span></span>
          <span class="stat-level">LV 1</span>
        </li>
        <li class="stat" data-stat="WIS">
          <span class="stat-name">WIS</span>
          <span class="mini-bar"><span class="mini-fill"></span></span>
          <span class="stat-level">LV 1</span>
        </li>
      </ul>

      <h3>Record</h3>
      <dl class="record">
        <dt>Quests done</dt>
        <dd id="quests-done">0</dd>
        <dt>Best stat</dt>
        <dd id="best-stat">—</dd>
      </dl>
    </div>
  </dialog>
  <form id="task-form">
    <label for="task-input">Enter task here: </label>
    <input type="text" name="task" id="task-input" required />
    <!-- Which stat this task trains; WIS is picked unless you change it -->
    <label for="stat-input" class="visually-hidden">Stat this task trains</label>
    <select id="stat-input">
      <option value="STR">STR</option>
      <option value="INT">INT</option>
      <option value="CRE">CRE</option>
      <option value="CHA">CHA</option>
      <option value="WIS" selected>WIS</option>
    </select>
    <button type="submit" id="add-button">Add to list!</button>
  </form>
  <ul id="task-list">
  </ul>
  <p id="xp-display">
    <span id="xp-level">LV 1</span>
    <span id="xp-bar"><span id="xp-fill"></span></span>
    <span id="xp-numbers">0 / 60 XP</span>
  </p>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>
</body>

</html>
